# Prepares a bare old-glibc container to build the dig-relay Linux artifact, and DECLARES the
# canonical glibc floor that artifact must honour.
#
# WHY (#2185, porting dig-node's #1736 pattern): a glibc-linked binary runs on its BUILD glibc and
# anything newer, never anything older — so the builder image, and nothing else, sets the
# supported-OS floor. dig-relay's linux-x64 binary silently began requiring glibc >= 2.39 (breaking
# Ubuntu 22.04 LTS, Debian 12 and Amazon Linux 2023) purely because GitHub repointed
# `ubuntu-latest` at Ubuntu 24.04. The job that produces the shipped Linux artifact therefore runs
# inside a PINNED container and calls this action, so there is one floor rather than one per workflow.
#
# The job must declare `container: debian:11`; this action asserts that the container it is running
# in really provides `glibc-floor`, so the image and the number cannot drift apart.
#
# Because this is a LOCAL composite action it can only run after `actions/checkout`, and checkout in
# a bare container needs `git` + `curl` + CA certificates already present — so the calling job
# bootstraps exactly those first, then checks out, then calls this action.
name: Set up an old-glibc Linux build
description: Install the Rust + C toolchains in the pinned old-glibc container and assert its glibc matches the canonical floor.

outputs:
  glibc-floor:
    description: "The canonical minimum glibc version every published dig-relay Linux artifact must run on."
    value: ${{ steps.floor.outputs.version }}

runs:
  using: composite
  steps:
    - name: Declare the canonical glibc floor
      id: floor
      shell: bash
      # THE single source of truth for the floor. 2.31 (Debian 11) clears every distro #2185
      # reported broken — Ubuntu 22.04 (2.35), Debian 12 (2.36), Amazon Linux 2023 (2.34) — plus
      # Ubuntu 20.04 (2.31), Debian 11 (2.31) and RHEL 9 (2.34). Raising it is a DELIBERATE act:
      # change this value, the `container:` image in the calling job, SPEC.md and the published docs
      # together — never one alone.
      run: echo "version=2.31" >>"$GITHUB_OUTPUT"

    - name: Install the Rust + C toolchains
      shell: bash
      # The container is a bare Debian 11 with neither toolchain. dig-relay is pure-Rust TLS
      # (rustls/ring — NO openssl-sys), so the heavy openssl build deps (perl/cmake) are not needed;
      # `build-essential` supplies the C compiler `ring`'s build script wants, `clang` covers any
      # -sys crate that prefers it, `pkg-config` is a cheap belt-and-braces, and `binutils` provides
      # the `readelf` the floor gate reads.
      #
      # ROOT CAUSE + full measurement history: see `build-binaries.yml`'s "Bootstrap the container for
      # checkout" step — this step ran the identical bootstrap against the live suite. Summary:
      # `bullseye-security`'s live mirror network is internally inconsistent as the suite retires —
      # its Packages index names package versions the pool no longer serves, and the mismatch differs
      # PER ARCHITECTURE — so no mirror choice or retry strategy fixes it.
      #
      # FIX: stop depending on the live mirror network. Pin all three suite lines to the same
      # immutable `snapshot.debian.org` timestamp used in `build-binaries.yml` (`20260901T000000Z`),
      # whose index and pool were captured together and verified end-to-end there.
      # `Acquire::Check-Valid-Until "false"` is required for a pinned snapshot and is NOT the
      # live-suite-EOL question tracked as dig-relay#2185 — see `build-binaries.yml` for why that
      # distinction holds.
      run: |
        set -eux
        cat > /etc/apt/sources.list <<'SOURCES_EOF'
        deb http://snapshot.debian.org/archive/debian/20260901T000000Z bullseye main
        deb http://snapshot.debian.org/archive/debian/20260901T000000Z bullseye-updates main
        deb http://snapshot.debian.org/archive/debian-security/20260901T000000Z bullseye-security main
        SOURCES_EOF
        echo 'Acquire::Check-Valid-Until "false";' > /etc/apt/apt.conf.d/99snapshot-no-valid-until
        for attempt in 1 2 3 4 5; do
          if apt-get update -qq && apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::No-Cache=true \
            ca-certificates curl git build-essential pkg-config clang binutils; then
            exit 0
          fi
          echo "apt bootstrap attempt $attempt/5 failed -- resetting apt/dpkg state and retrying" >&2
          dpkg --configure -a || true
          apt-get -f install -y || true
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          sleep $(( attempt * 10 ))
        done
        echo "::error::apt bootstrap failed after 5 attempts" >&2
        exit 1

    - name: Verify the container glibc IS the declared floor
      shell: bash
      run: |
        set -eu
        # NO PIPE. `ldd --version | head -n1` is a SIGPIPE race: `head` closes the pipe after the
        # first line, `ldd` dies with SIGPIPE, and under `pipefail` the step fails with exit 141
        # — intermittently. Read the output into a variable and slice it with shell expansion.
        ldd_output="$(ldd --version 2>&1)"
        IFS= read -r first_line <<<"$ldd_output"
        # glibc's banner ends with the bare version, e.g. "ldd (Debian GLIBC 2.31-13) 2.31".
        actual="${first_line##* }"
        declared="${{ steps.floor.outputs.version }}"
        case "$actual" in
          [0-9]*.[0-9]*) ;;
          *)
            echo "::error::could not parse a glibc version out of: $first_line"
            exit 1
            ;;
        esac
        echo "container glibc: $actual, declared floor: $declared"
        test "$actual" = "$declared" || {
          echo "::error::build container glibc $actual != the declared floor $declared. Update the floor in .github/actions/setup-linux-build/action.yml, the calling job's container: image, SPEC.md and the docs TOGETHER."
          exit 1
        }

    - name: Install Rust via rustup
      shell: bash
      # rustup, not Debian 11's rustc, which is far older than this workspace needs. Only the Rust
      # toolchain comes from rustup — the glibc it links against is the container's, which is the
      # entire point of the container.
      run: |
        set -eu
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
          | sh -s -- -y --default-toolchain stable --profile minimal --no-modify-path
        echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
