# The ONE place dig-relay's cross-OS binary build lives. It is a REUSABLE workflow
# (`on: workflow_call` only — it never fires on its own): both release paths call it, so the
# OS/arch matrix + toolchain setup are defined exactly once (DRY, CLAUDE.md §2.5):
#
#   * release.yml          — the STABLE `vX.Y.Z` tag builder, and
#   * nightly-release.yml   — the NIGHTLY pre-release channel.
#
# The caller passes the version string stamped into each artifact's filename and, optionally,
# the git ref to build. The job builds the self-contained `dig-relay` server binary for every
# supported OS/arch and uploads them as run artifacts the caller's publish job then attaches to a
# GitHub Release.
#
# ASSET NAMING — each binary is published as `dig-relay-<ver>-<os>-<arch>[.exe]`, the CANONICAL
# name the dig-installer thin-shim expects (its dig-relay Repo stem is `dig-relay`; matched by
# dig-installer/src/asset.rs::select_asset against the os_arch slugs
# {windows-x64, linux-x64, macos-arm64, macos-x64}).
#
# dig-relay's dependency graph is pure-Rust TLS (rustls), so there is NO openssl-sys in any
# target's graph and every target builds without a cross C-toolchain (macos-x64 is cross-compiled
# on the Apple-silicon runner). A linux-arm64 cross-compile would be clean too; it is omitted to
# match the installer's x64-only Linux matrix — add it when an arm64-Linux consumer appears.
#
# The gate runs fmt + clippy only — a PR's own CI (ci.yml) already ran the full
# fmt/clippy/test/coverage set against the merged tree before merge (§2.4a). fmt/clippy are
# deterministic (never flaky), so they stay as a cheap fail-fast before spending build minutes;
# re-running the test suite on the release path is redundant flake-exposure that has blocked a
# release before (#488).
name: Build binaries (reusable)

on:
  workflow_call:
    inputs:
      version:
        description: "Version string stamped into each artifact filename (e.g. `1.2.3` or `1.2.3-nightly.20260714.abc1234`)."
        type: string
        required: true
      ref:
        description: "Git ref (tag / branch / SHA) to check out and build. Empty = the caller run's commit."
        type: string
        required: false
        default: ""

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Gate: fmt + clippy once on Linux (fast, deterministic, non-flaky). A ref that fails the gate
  # never produces binaries. Tests are NOT re-run here — see the header comment.
  check:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust (stable + components)
        run: |
          rustup toolchain install stable --component rustfmt --component clippy
          rustup default stable
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-relay-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-relay-check-
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  build:
    name: build (${{ matrix.out_name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: dig-relay.exe
            out_name: windows-x64.exe
          - os: macos-14 # Apple silicon (arm64)
            target: aarch64-apple-darwin
            bin: dig-relay
            out_name: macos-arm64
          - os: macos-14 # Apple silicon — cross-compiles the Intel binary
            target: x86_64-apple-darwin
            bin: dig-relay
            out_name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install Rust + target
        shell: bash
        run: |
          rustup toolchain install stable
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustc --version
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-relay-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-relay-build-${{ matrix.target }}-
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dig-relay
      - name: Stage artifact
        # The caller's `version` is stamped into the filename verbatim: a plain `1.2.3` for a
        # stable tag, or the synthesized `1.2.3-nightly.YYYYMMDD.<shortsha>` for a nightly.
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/${{ matrix.bin }}"
          test -f "$SRC" || { echo "binary not produced: $SRC"; exit 1; }
          # `out_name` already carries the .exe on Windows; unix has no extension.
          cp "$SRC" "dist/dig-relay-${VER}-${{ matrix.out_name }}"
          ls -la dist
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dig-relay-${{ matrix.out_name }}
          path: dist/*
          if-no-files-found: error

  # The LINUX target, built NATIVELY inside a pinned old-glibc container so the supported-OS floor is
  # a decision rather than a side effect of whatever image `ubuntu-latest` points at this month
  # (#2185 — ports dig-node's proven #1736 pattern). A -gnu binary runs on its BUILD glibc and
  # anything newer, never anything older, so building on Ubuntu 24.04 (glibc 2.39) silently broke
  # Ubuntu 22.04 (2.35), Debian 12 (2.36) and Amazon Linux 2023 (2.34). Building in debian:11
  # (glibc 2.31) fixes the floor; the assertion step below keeps it from drifting back.
  build-linux:
    name: build (${{ matrix.out_name }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            out_name: linux-x64
    runs-on: ubuntu-latest
    # Debian 11 = glibc 2.31 = the floor declared by `.github/actions/setup-linux-build`, which
    # asserts the two agree — so bumping this image without bumping the floor fails the build
    # instead of silently shipping a higher floor.
    container: debian:11
    steps:
      # Bootstrap only what `actions/checkout` itself needs in a bare container; the full toolchain
      # (and the floor assertion) comes from the local composite action, which cannot run until the
      # repository is on disk.
      - name: Bootstrap the container for checkout
        run: |
          set -eux
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Trust the checkout (git runs as root in the container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: setup
        uses: ./.github/actions/setup-linux-build
      - run: rustc --version && cargo --version
      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          # The glibc floor is part of the cache key: artifacts built against a different glibc must
          # never be restored into a build that claims a different floor.
          key: linux-glibc${{ steps.setup.outputs.glibc-floor }}-relay-build-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-glibc${{ steps.setup.outputs.glibc-floor }}-relay-build-${{ matrix.target }}-
      - name: Build release binary
        # The triple is the HOST's here (native build, no cross-compilation), but it is passed
        # explicitly anyway so the output lands in `target/<triple>/release/` — the path the staging
        # step below reads, matching the other-OS jobs.
        run: cargo build --release --locked --target ${{ matrix.target }} --bin dig-relay
      - name: Stage artifact
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          mkdir -p dist
          SRC="target/${{ matrix.target }}/release/dig-relay"
          test -f "$SRC" || { echo "binary not produced: $SRC"; exit 1; }
          cp "$SRC" "dist/dig-relay-${VER}-${{ matrix.out_name }}"
          ls -la dist
      - name: Assert the glibc floor of the produced binary
        # The gate that makes the floor durable (the CI check #2185 requires).
        run: |
          set -eu
          bin="dist/dig-relay-${{ inputs.version }}-${{ matrix.out_name }}"
          bash scripts/check-glibc-floor.sh "$bin" "${{ steps.setup.outputs.glibc-floor }}"
          # Prove the gate is not a no-op against a REAL binary, not just the unit tests' stub
          # readelf: every ELF references at least the base glibc version (2.2.5 on x86_64), so a
          # floor of 2.0 MUST be rejected. A gate that cannot fail is a rubber stamp.
          if bash scripts/check-glibc-floor.sh "$bin" 2.0 >/dev/null 2>&1; then
            echo "::error::check-glibc-floor.sh accepted an impossible 2.0 floor for $bin — the gate is not working"
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dig-relay-${{ matrix.out_name }}
          path: dist/*
          if-no-files-found: error

  # PROOF, not inference: start the published Linux binary on the OLDEST distros it claims to
  # support. `check-glibc-floor.sh` on the builder says what the binary was linked against; only
  # executing it on the target says it STARTS there (dig-node's #1736 was found by a binary that
  # died at exec time, which a symbol-table check cannot catch). Ports dig-node's `verify-linux-floor`
  # job (#2200) — dig-relay ships only linux-x64, so the matrix is the three x64 baselines.
  #
  # WHY `--version`: it is the one invocation that touches no config, no network, no filesystem
  # state and no service manager, so it isolates "does the dynamic loader resolve this binary".
  verify-linux-floor:
    name: verify (${{ matrix.out_name }} on ${{ matrix.image }})
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          # The three oldest supported baselines (glibc 2.34–2.36), each on the x64 runner so the
          # binary executes natively rather than under emulation.
          - runner: ubuntu-latest
            out_name: linux-x64
            image: ubuntu:22.04
          - runner: ubuntu-latest
            out_name: linux-x64
            image: debian:12
          - runner: ubuntu-latest
            out_name: linux-x64
            image: amazonlinux:2023
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dig-relay-${{ matrix.out_name }}
          path: dist
      - name: Run the binary on ${{ matrix.image }}
        run: |
          set -eu
          chmod +x dist/*
          bin="dig-relay-${{ inputs.version }}-${{ matrix.out_name }}"
          echo "::group::$bin on ${{ matrix.image }}"
          # `ldd` FIRST and unconditionally: the dynamic loader names only the FIRST unsatisfied
          # library, so a partial fix reads as a brand-new regression. Logging the full dependency
          # set makes the real remaining gap visible in one run.
          docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.image }}" \
            sh -c "ldd /dist/$bin || true"
          docker run --rm -v "$PWD/dist:/dist:ro" "${{ matrix.image }}" \
            /dist/$bin --version
          echo "::endgroup::"
