# Ship a released dig-relay to the canonical relay.dig.net.
#
# The stable binary release (release.yml) publishes per-OS binaries so anyone can run their own
# relay; THIS workflow additionally ships the same tagged commit to the canonical relay.dig.net
# ECS/Fargate service, so the hosted relay never drifts behind a stable release (dig_ecosystem
# #985 — a stale relay lacks resolve_dialable and peer introductions carry no dialable address).
#
# ── WHAT THIS WORKFLOW OWNS ──────────────────────────────────────────────────────────────────────
# It owns the relay's VERSION and nothing else. It builds the container image from this commit,
# pushes it to ECR, and hands the tag to relay.dig.net's terraform, which owns the task definition's
# SHAPE — ports, container command, log config, and the DIG_RELAY_TRUSTED_PROXY_CIDRS security
# boundary. This workflow makes no ECS API calls at all.
#
# It used to. It read the LIVE task definition with `describe-task-definition`, rendered the new image
# onto it and registered a revision — while relay.dig.net's terraform applied its own idea of the same
# resource. Two writers, one resource, no arbitration (dig_ecosystem #1938). Two consequences, both
# real: terraform's recorded revision trailed the running one by eighteen, and because this workflow
# cloned whatever was live, every hand edit was carried forward forever. That is how
# `--dashboard-listen`, the 8080 port mapping and DIG_RELAY_TRUSTED_PROXY_CIDRS came to exist in
# production while being absent from the terraform source — a security boundary living only in a
# console, reviewable by nobody.
#
# Flow (on a `vX.Y.Z` tag, or a manual dispatch): build the container from THIS commit, push it to
# ECR tagged with the git SHA, then dispatch relay.dig.net's `deploy.yml` with that tag and watch the
# run — so a failed terraform apply fails this deploy too, rather than leaving a pushed image nobody
# noticed never shipped.
#
# Auth: keyless GitHub OIDC into the least-privilege `dig-relay-ci-deploy` IAM role (ECR push only),
# plus `RELEASE_TOKEN` to dispatch the deploy in the other repo.

name: Deploy (relay.dig.net)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: deploy-relay
  cancel-in-progress: false

# Least privilege: OIDC token to assume the AWS role + read the repo. No write scopes.
permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: dig-relay
  # The repo whose terraform owns the relay's task definition, and the workflow that applies it.
  INFRA_REPO: DIG-Network/relay.dig.net
  INFRA_WORKFLOW: deploy.yml

jobs:
  deploy:
    name: Build image and hand it to the infra deploy
    runs-on: ubuntu-latest
    # A from-scratch image build here normally takes ~5 minutes. On v0.16.0 one took 3h28m and the
    # job then died on expired credentials, so the release never shipped while the run still looked
    # alive. Cap the job well above the normal build but far below the point where a stall becomes a
    # silent multi-hour hole: a pathological build now fails FAST and visibly. The cap also bounds
    # the downstream watch below.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::873139760123:role/dig-relay-ci-deploy
          aws-region: ${{ env.AWS_REGION }}

      # The ECR authorization token is valid for 12 hours — comfortably longer than this job's cap —
      # so unlike the assumed-role session it cannot expire behind a slow build.
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tag the image with the full git SHA. The tag IS the provenance: relay.dig.net's version gate
      # resolves it against this repo's history to prove a deploy is a forward step, so it must name
      # a real commit here.
      - name: Build and push image
        id: build
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Hand the tag to the terraform that owns the task definition. `gh workflow run` returns no run
      # id, so the new run is identified by watching for a workflow_dispatch run that was not there
      # before the dispatch. The subsequent watch is what makes a failed apply fail THIS release.
      #
      # If relay.dig.net's `production` environment ever gains required reviewers, this step will
      # block until the job timeout above — an approval gate on a release path is a deliberate
      # decision, and this is where it would be felt.
      - name: Deploy via relay.dig.net terraform
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          latest_dispatch_id() {
            gh run list --repo "$INFRA_REPO" --workflow "$INFRA_WORKFLOW" \
              --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // 0'
          }

          before="$(latest_dispatch_id)"
          gh workflow run "$INFRA_WORKFLOW" --repo "$INFRA_REPO" --ref main \
            -f image_tag="$IMAGE_TAG"

          run_id=""
          for _ in $(seq 1 40); do
            sleep 5
            candidate="$(latest_dispatch_id)"
            if [ "$candidate" != "$before" ] && [ "$candidate" != "0" ]; then
              run_id="$candidate"
              break
            fi
          done

          if [ -z "$run_id" ]; then
            echo "::error::dispatched $INFRA_REPO $INFRA_WORKFLOW but no run appeared within 200s."
            echo "The image $IMAGE_TAG is pushed; re-dispatch the deploy manually with that tag."
            exit 1
          fi

          echo "Watching https://github.com/$INFRA_REPO/actions/runs/$run_id"
          gh run watch "$run_id" --repo "$INFRA_REPO" --exit-status
